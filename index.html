<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿耒 · 个人主页</title>
<meta name="description" content="阿耒的个人主页。">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    color: #1a1a1a;
    background: #f7f3ea;
    line-height: 1.8;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px 80px; }
  header { border-bottom: 3px double #1a1a1a; padding-bottom: 24px; margin-bottom: 32px; }
  .kicker { font-size: 13px; letter-spacing: .35em; color: #777; }
  h1 { font-size: 56px; line-height: 1.1; margin: 12px 0 8px; font-weight: 600; }
  .sub { font-size: 18px; color: #555; margin: 0; }
  section { margin: 36px 0; }
  h2 { font-size: 20px; margin: 0 0 12px; border-bottom: 1px solid #ccc; padding-bottom: 6px; }
  p { margin: 0 0 14px; font-size: 17px; }
  ul { margin: 0; padding-left: 20px; font-size: 17px; }
  li { margin-bottom: 8px; }
  a { color: #1a1a1a; text-underline-offset: 3px; }
  footer { margin-top: 56px; border-top: 1px solid #ccc; padding-top: 16px; font-size: 14px; color: #888; }
  @media (max-width: 520px) { h1 { font-size: 44px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">个人主页 · PERSONAL SITE</div>
    <h1>阿耒</h1>
    <p class="sub">你好，我是阿耒。名字是儿时，长辈给起的昵称。</p>
  </header>

  <section>
    <h2>关于我</h2>
    <p>这里是我的个人主页，放在 GitHub Pages 上。</p>
    <p>我正在这里慢慢写东西、记录生活。页面还很简单，会一点一点长大。</p>
  </section>

  <section>
    <h2>在写什么</h2>
    <ul>
      <li>个人博客：正在写第一篇，敬请期待。</li>
      <li>生活记录：想到什么，就写下来。</li>
    </ul>
  </section>

  <section>
    <h2>找到我</h2>
    <ul>
      <li><a href="https://github.com/guava1986">GitHub · guava1986</a></li>
    </ul>
  </section>

  <footer>© 阿耒 · 托管于 GitHub Pages</footer>
</div>
</body>
</html>
